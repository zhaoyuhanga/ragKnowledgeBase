# ================================================
# RAG 知识库系统 - 本地开发环境配置（示例）
# 说明：复制本文件为 application-local.yml 后填写实际值
# 真实配置不应进入版本控制（已被 .gitignore 排除）
# ================================================

# 服务器配置
server:
  port: 8011
  host: 127.0.0.1
  reload: true
  workers: 1

# 数据库配置 - MySQL 8.0
database:
  host: localhost
  port: 3308
  username: root           # 与 docker-compose 中的 MYSQL_ROOT_PASSWORD 对应
  password: ""             # 通过环境变量 DATABASE_PASSWORD 覆盖
  name: rag_db
  charset: utf8mb4
  pool_size: 5
  max_overflow: 10
  pool_recycle: 3600
  echo: true

# Redis 配置
redis:
  host: localhost
  port: 6379
  password: ""             # 通过环境变量 REDIS_PASSWORD 覆盖
  db: 0
  decode_responses: true
  socket_timeout: 5
  socket_connect_timeout: 5

# Milvus 向量数据库配置
milvus:
  host: localhost
  port: 19530
  timeout: 30
  pool_size: 10
  alias: default

# RabbitMQ 消息队列配置
rabbitmq:
  host: localhost
  port: 5672
  username: guest
  password: ""             # 通过环境变量 RABBITMQ_PASSWORD 覆盖
  virtual_host: /
  heartbeat: 600
  connection_timeout: 30
  pool_size: 5
  max_channels_per_connection: 100
  exchange:
    name: rag_exchange
    type: topic
    durable: true
  queues:
    parse_queue:
      name: rag_parse_queue
      routing_key: rag.parse.#
      durable: true
    clean_queue:
      name: rag_clean_queue
      routing_key: rag.clean.#
      durable: true
    chunk_queue:
      name: rag_chunk_queue
      routing_key: rag.chunk.#
      durable: true
    embedding_queue:
      name: rag_embedding_queue
      routing_key: rag.embedding.#
      durable: true
    index_queue:
      name: rag_index_queue
      routing_key: rag.index.#
      durable: true
  dead_letter:
    exchange: rag_dlx_exchange
    queue: rag_dlx_queue
    routing_key: dlx
    durable: true

# 应用配置
app:
  name: RAG知识库系统
  version: 1.0.0
  debug: true
  env: local
  description: RAG知识库系统后端API服务

# 日志配置
logging:
  level: INFO
  format: json
  audit_enabled: true
  file:
    enabled: true
    path: ./logs/app.log
    max_bytes: 10485760
    backup_count: 5
  console:
    enabled: true

# CORS 跨域配置
cors:
  enabled: true
  allow_origins:
    - http://localhost:3011
    - http://127.0.0.1:3011
  allow_methods:
    - "*"
  allow_headers:
    - "*"
  allow_credentials: true

# API 文档配置
api:
  title: RAG知识库系统API
  description: 基于FastAPI的RAG知识库系统后端接口
  version: 1.0.0
  prefix: /api/v1
  docs_url: /docs
  redoc_url: /redoc

# 文档解析配置
document:
  upload:
    max_size: 104857600
    allowed_extensions:
      - pdf
      - docx
      - doc
      - txt
      - md
      - html
      - xlsx
      - xls
  storage:
    base_path: ./data/uploads
    temp_path: ./data/temp
  parsing:
    # 仅在安装了 pytesseract / Tesseract 时才设为 true
    # 否则 PDF/图片解析会运行时报 ModuleNotFoundError
    ocr_enabled: false
    ocr_language: chn_sim
    max_pages: 1000

# 切分配置
chunk:
  target_tokens: 600
  max_tokens: 900
  min_tokens: 120
  overlap_tokens: 100
  semantic_threshold: 0.85

# 向量化配置
embedding:
  # Ollama 实际部署的模型名称，按需调整
  model_name: qwen3-embedding:4b-q6
  dimension: 1024
  batch_size: 32
  cache_enabled: true
  cache_ttl: 86400
  use_ollama: true
  ollama_host: http://localhost:11434
  ollama_timeout: 120
  ollama_retry_times: 3
  fallback_to_mock: true

# 检索配置
retrieval:
  vector_top_k: 100
  keyword_top_k: 100
  rrf_k: 60
  fusion_top_k: 20
  rerank_top_k: 10
  vector_weight: 0.6
  keyword_weight: 0.4

# 查询改写配置
query_rewrite:
  enable_normalize: true
  enable_multi_query: true
  enable_subquery: true
  enable_hyde: false            # HyDE 暂为接口预留，未启用
  enable_background: false      # 后退提示 暂为接口预留，未启用
  use_llm: false
  max_queries: 5
  remove_stopwords: true

# JWT 认证配置
jwt:
  # 生产环境必须通过环境变量 JWT_SECRET_KEY 覆盖
  secret_key: change-me-in-production
  algorithm: HS256
  access_token_expire_minutes: 120
  refresh_token_expire_days: 7

# LLM 配置
llm:
  # 按实际订阅的模型选择：deepseek / openai / zhipu / qwen
  provider: deepseek
  # 真实 key 通过环境变量 LLM_API_KEY 注入
  api_key: ""
  model_name: deepseek-chat
  base_url: https://api.deepseek.com
  max_tokens: 4000
  temperature: 0.7
  timeout: 120

# 缓存配置
cache:
  embedding:
    ttl: 86400
    max_size: 10000
  query:
    ttl: 3600
    max_size: 5000

# 视觉模型配置
vision:
  model_name: qwen2.5-ocr
  ollama_host: http://localhost:11434
  timeout: 180
  retry_times: 3
  enabled: true
